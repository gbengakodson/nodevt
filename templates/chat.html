{% extends 'base/base.html' %}

{% block title %}Support | NODE Crypto Automation{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #F0B90B;
        --bg-body: #0B0E11;
        --bg-card: #1E2329;
        --text-primary: #EAECEF;
        --text-secondary: #848E9C;
        --border: #2B3139;
        --success: #0ECB81;
        --danger: #F6465D;
    }

    * { box-sizing: border-box; }
    body { background: var(--bg-body) !important; }

    .support-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
    }

    .support-layout {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 16px;
        height: calc(100vh - 140px);
        min-height: 600px;
    }

    /* FAQ Sidebar */
    .faq-sidebar {
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .faq-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .faq-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
    }
    .faq-list::-webkit-scrollbar { width: 4px; }
    .faq-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .faq-item {
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s;
        font-size: 11px;
        color: var(--text-secondary);
        border: 1px solid transparent;
        margin-bottom: 4px;
    }
    .faq-item:hover {
        background: rgba(240,185,11,0.05);
        color: var(--primary);
        border-color: rgba(240,185,11,0.15);
    }
    .faq-item .faq-icon {
        display: inline-block;
        width: 20px;
        margin-right: 8px;
        font-size: 13px;
    }

    /* Chat Panel */
    .chat-panel {
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .chat-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar {
        width: 34px; height: 34px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; flex-shrink: 0;
    }
    .msg-avatar.admin { background: var(--primary); color: #1E2329; }
    .msg-avatar.user { background: var(--success); color: #fff; }
    .msg-bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.5;
    }
    .msg-row.admin .msg-bubble { background: rgba(240,185,11,0.08); color: var(--text-primary); border: 1px solid rgba(240,185,11,0.15); }
    .msg-row.user .msg-bubble { background: var(--primary); color: #1E2329; }
    .msg-time { font-size: 9px; color: var(--text-secondary); margin-top: 4px; }

    .chat-input-area {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
    }
    .chat-input-area textarea {
        flex: 1;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(0,0,0,0.3);
        color: var(--text-primary);
        font-size: 12px;
        resize: none;
        height: 44px;
        font-family: inherit;
    }
    .chat-input-area textarea:focus { outline: none; border-color: var(--primary); }
    .btn-send {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: var(--primary);
        color: #1E2329;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn-send:hover { filter: brightness(1.1); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-state {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
        font-size: 12px;
    }

    /* Modal */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); z-index: 1000;
        display: none; align-items: center; justify-content: center;
    }
    .modal-box {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        max-width: 500px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        padding: 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
    }
    .modal-box h3 {
        font-size: 15px;
        color: var(--primary);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .modal-box p {
        font-size: 12px;
        color: var(--text-primary);
        line-height: 1.6;
    }
    .modal-box .btn-close-modal {
        display: block;
        margin: 16px auto 0;
        padding: 8px 24px;
        border-radius: 6px;
        border: 1px solid var(--primary);
        background: transparent;
        color: var(--primary);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
    }
    .modal-box .btn-close-modal:hover { background: var(--primary); color: #1E2329; }

    @media (max-width: 900px) {
        .support-layout {
            grid-template-columns: 1fr;
            height: auto;
        }
        .faq-sidebar { max-height: 250px; }
        .chat-panel { height: 450px; }
    }
</style>
{% endblock %}

        var token = getToken();
        var headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        var opts = { method: method || 'GET', headers: headers };
        if (data) opts.body = JSON.stringify(data);
        var res = await fetch(API + url, opts);
        if (res.status === 401) { localStorage.clear(); window.location.href = '/login/?next=/chat/'; return {}; }
        return res.json();
    }

    // Render FAQ List
    function renderFAQ() {
        var html = '';
        for (var i = 0; i < faqs.length; i++) {
            html += '<div class="faq-item" onclick="openFaq(' + i + ')"><span class="faq-icon">' + faqs[i].icon + '</span>' + faqs[i].q + '</div>';
        }
        document.getElementById('faqList').innerHTML = html;
    }

    function openFaq(index) {
        currentFaqIndex = index;
        var faq = faqs[index];
        document.getElementById('faqModalTitle').textContent = faq.icon + ' ' + faq.q;
        document.getElementById('faqModalBody').innerHTML = '<p>' + faq.a.replace(/\n/g, '<br><br>') + '</p>';
        document.getElementById('faqModal').style.display = 'flex';

        // Update URL with referral code for sharing (if user is logged in)
        if (typeof userData !== 'undefined' && userData && userData.referral_code) {
            var newUrl = '/chat/?faq=' + index + '&ref=' + userData.referral_code;
            window.history.replaceState({}, '', newUrl);
        }
    }

    async function loadUserData() {
        try {
            userData = await apiCall('/auth/profile/');
        } catch(e) {
            userData = null;
        }
    }

    // Call it on init
    loadUserData();

    function copyFaqLink() {
        var link = window.location.origin + '/chat/?faq=' + currentFaqIndex;
        if (typeof userData !== 'undefined' && userData && userData.referral_code) {
            link += '&ref=' + userData.referral_code;
        }
        navigator.clipboard.writeText(link);
        showModal('✅ Link copied! Share with friends.', 'success');
    }


    function closeFaqModal() {
        document.getElementById('faqModal').style.display = 'none';
    }

    // Chat Functions
    async function loadMessages() {
        try {
            var res = await apiCall('/chat/messages/');
            var container = document.getElementById('chatMessages');
            if (!res || res.length === 0) {
                container.innerHTML = '<div class="empty-state">No messages yet. Ask us anything!</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < res.length; i++) {
                var msg = res[i];
                var isAdmin = msg.is_admin;
                var name = isAdmin ? 'NODE Support' : 'You';
                html += '<div class="msg-row ' + (isAdmin ? 'admin' : 'user') + '">' +
                    (isAdmin ? '<div class="msg-avatar admin">👨‍💼</div>' : '') +
                    '<div>' +
                        '<div style="font-size:9px;color:var(--text-secondary);margin-bottom:2px;">' + name + '</div>' +
                        '<div class="msg-bubble">' + escHtml(msg.message) + '</div>' +
                        '<div class="msg-time">' + (msg.date || msg.time || '') + '</div>' +
                    '</div>' +
                    (!isAdmin ? '<div class="msg-avatar user">👤</div>' : '') +
                '</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        } catch(e) {}
    }

    async function sendMessage() {
        var input = document.getElementById('messageInput');
        var msg = input.value.trim();
        if (!msg) return;
        var btn = document.getElementById('btnSend');
        btn.disabled = true;
        btn.textContent = '...';
        try {
            var res = await apiCall('/chat/send/', 'POST', { message: msg });
            if (res.success) { input.value = ''; loadMessages(); }
        } catch(e) {}
        btn.disabled = false;
        btn.textContent = 'Send';
    }

    function escHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Check for FAQ query parameter (for shared links)
    function checkQueryParam() {
        var params = new URLSearchParams(window.location.search);
        var faqIndex = parseInt(params.get('faq'));
        if (!isNaN(faqIndex) && faqIndex >= 0 && faqIndex < faqs.length) {
            openFaq(faqIndex);
        }
    }

    // When user copies FAQ link, include their referral code
    function getFaqShareLink(index) {
        var code = userData ? userData.referral_code : '';
        var base = window.location.origin + '/chat/?faq=' + index;
        if (code) base += '&ref=' + code;
        return base;
    }

    // Init
    document.addEventListener('DOMContentLoaded', function() {
        renderFAQ();
        loadMessages();
        loadUserData();
        checkQueryParam();
        setInterval(loadMessages, 15000);

        // Close modal on overlay click
        var modal = document.getElementById('faqModal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) closeFaqModal();
            });
        }
    });
</script>
{% endblock %}
