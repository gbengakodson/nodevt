{% extends 'base/base.html' %}

{% block title %}Support | NODE{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #F0B90B;
        --bg-body: #0B0E11;
        --bg-card: #1E2329;
        --text-primary: #EAECEF;
        --text-secondary: #848E9C;
        --border: #2B3139;
        --success: #0ECB81;
        --danger: #F6465D;
    }

    * { box-sizing: border-box; }
    body { background: var(--bg-body) !important; }

    .support-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
        height: calc(100vh - 80px);
    }

    .support-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 12px;
        height: 100%;
    }

    /* FAQ Sidebar */
    .faq-sidebar {
        background: var(--bg-card);
        border-radius: 14px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .faq-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
    }
    .faq-search {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
    }
    .faq-search input {
        width: 100%;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text-primary);
        font-size: 11px;
    }
    .faq-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }
    .faq-item {
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 11px;
        color: var(--text-secondary);
        margin-bottom: 2px;
    }
    .faq-item:hover {
        background: rgba(240,185,11,0.06);
        color: var(--primary);
    }

    /* Chat Panel */
    .chat-panel {
        background: var(--bg-card);
        border-radius: 14px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .chat-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .chat-header .avatar {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: var(--primary);
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; color: #1E2329;
    }
    .chat-header .info .name {
        font-size: 13px; font-weight: 600; color: var(--text-primary);
    }
    .chat-header .info .status {
        font-size: 10px; color: var(--success);
        display: flex; align-items: center; gap: 4px;
    }
    .status-dot {
        width: 6px; height: 6px;
        border-radius: 50%; background: var(--success);
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(14,203,129,0.4); }
        70% { box-shadow: 0 0 0 6px rgba(14,203,129,0); }
        100% { box-shadow: 0 0 0 0 rgba(14,203,129,0); }
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-wrapper {
        display: flex;
        gap: 8px;
        max-width: 80%;
        animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .msg-wrapper.user {
        align-self: flex-end;
        flex-direction: row-reverse;
    }
    .msg-wrapper.admin {
        align-self: flex-start;
    }
    .msg-avatar-sm {
        width: 28px; height: 28px;
        border-radius: 50%; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px;
    }
    .msg-avatar-sm.admin { background: var(--primary); color: #1E2329; }
    .msg-avatar-sm.user { background: var(--success); color: #fff; }

    .msg-content .sender {
        font-size: 9px; color: var(--text-secondary);
        margin-bottom: 2px;
    }
    .msg-bubble {
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
    }
    .msg-wrapper.admin .msg-bubble {
        background: rgba(240,185,11,0.08);
        color: var(--text-primary);
        border-bottom-left-radius: 4px;
    }
    .msg-wrapper.user .msg-bubble {
        background: var(--primary);
        color: #1E2329;
        border-bottom-right-radius: 4px;
    }
    .msg-time {
        font-size: 9px; color: var(--text-secondary);
        margin-top: 2px;
    }

    .typing-indicator {
        display: none;
        align-self: flex-start;
        padding: 10px 14px;
        background: rgba(240,185,11,0.06);
        border-radius: 14px;
        font-size: 11px; color: var(--text-secondary);
    }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots span {
        width: 5px; height: 5px;
        border-radius: 50%; background: var(--text-secondary);
        animation: bounce 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
    }

    .chat-input-area {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        align-items: flex-end;
    }
    .chat-input-area textarea {
        flex: 1;
        padding: 10px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text-primary);
        font-size: 12px;
        resize: none;
        height: 40px;
        max-height: 100px;
        font-family: inherit;
        transition: border 0.2s;
    }
    .chat-input-area textarea:focus {
        outline: none;
        border-color: var(--primary);
    }
    .btn-send {
        width: 40px; height: 40px;
        border-radius: 50%;
        border: none;
        background: var(--primary);
        color: #1E2329;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
    }
    .btn-send:hover { transform: scale(1.05); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 768px) {
        .support-layout { grid-template-columns: 1fr; }
        .faq-sidebar { max-height: 200px; }
        .support-container { height: auto; }
        .chat-panel { height: 450px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="support-container">
    <div class="support-layout">
        <!-- FAQ Sidebar -->
        <div class="faq-sidebar">
            <div class="faq-header">📚 FAQ</div>
            <div class="faq-search">
                <input type="text" id="faqSearch" placeholder="Search questions..." oninput="filterFAQ()">
            </div>
            <div class="faq-list" id="faqList"></div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="avatar">💬</div>
                <div class="info">
                    <div class="name">NODE Support</div>
                    <div class="status">
                        <span class="status-dot"></span> Online — replies instantly
                    </div>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div style="text-align:center;color:var(--text-secondary);padding:40px;font-size:12px;">
                    👋 Welcome to NODE Support<br>
                    <span style="font-size:10px;">Ask us anything or browse FAQs</span>
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
            <!-- Admin Reply Bar -->
            <div id="adminReplyBar" style="display:none;padding:8px 16px;border-top:1px solid var(--border);background:rgba(240,185,11,0.03);">
                <div style="display:flex;gap:8px;align-items:center;">
                    <span style="font-size:10px;color:var(--text-secondary);">Reply to:</span>
                    <select id="targetUserSelect" class="form-input" style="font-size:10px;padding:6px 10px;flex:1;"></select>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="messageInput" placeholder="Type your message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>

    var selectedTargetUser = null;
    var isAdmin = false;
    var faqs = [
        // === GETTING STARTED ===
        { icon: '🤖', q: 'What is NODE exactly?', a: 'NODE is an automated crypto grid trading platform. You deposit USDC, activate a Position Tracker, and the bot automatically buys low and sells high within a price range — 24/7. You earn variable profits from market volatility. No manual trading. No chart-watching. No experience needed.' },

        { icon: '🚀', q: 'How can I get started?', a: 'Register on NODE with your email. You\'ll get a unique BSC wallet address. Buy USDC from Binance. Send it to your NODE wallet. Once it arrives, go to the Trading page, pick a coin, and activate your first Position Tracker. Takes less than 10 minutes.' },

        // === DEPOSITS & WITHDRAWALS ===
        { icon: '💵', q: 'How do I deposit funds?', a: '1) Buy USDC on Binance or any exchange. 2) Go to your NODE Profile, copy your unique wallet address. 3) Send USDC to that address using BSC/BEP20 network. 4) Your balance updates automatically within minutes.' },

        { icon: '👁️', q: 'Can I verify NODE\'s trading activity?', a: 'Yes. Our Transparency page shows live platform data. Master Grid trades happen on a public Binance wallet — anyone can verify on BSCScan. All deposits and withdrawals are publicly visible.' },

    function renderFAQ() {
        var html = '';
        for (var i = 0; i < faqs.length; i++) {
            html += '<div class="faq-item" onclick="openFaq(' + i + ')"><span class="faq-icon">' + faqs[i].icon + '</span>' + faqs[i].q + '</div>';
        }
        document.getElementById('faqList').innerHTML = html;
    }
    renderFAQ();

    function openFaq(index) {
        var faq = faqs[index];
        var modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;';
        modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
        modal.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;padding:24px;">' +
            '<h3 style="font-size:16px;color:var(--primary);margin-bottom:12px;">' + faq.icon + ' ' + faq.q + '</h3>' +
            '<p style="font-size:13px;color:var(--text-primary);line-height:1.7;">' + faq.a.replace(/\n/g, '<br><br>') + '</p>' +
            '<button onclick="this.parentElement.parentElement.remove()" style="margin-top:16px;padding:10px 24px;border-radius:8px;border:1px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;width:100%;font-weight:600;">Close</button>' +
        '</div>';
        document.body.appendChild(modal);
    }

    async function loadMessages() {
        try {
            var res = await fetch('/api/chat/messages/', {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') }
            });
            if (!res.ok) return;
            var data = await res.json();
            if (!data || data.length === 0) return;

            var container = document.getElementById('chatMessages');
            var isNew = !lastMessageId || (data.length > 0 && data[data.length - 1].id !== lastMessageId);

            if (isNew) {
                container.innerHTML = '';
                data.forEach(function(msg) {
                    appendMessage(msg.message, msg.is_admin, msg.time || msg.date, msg.user_email);
                });
                lastMessageId = data[data.length - 1].id;
            }

            // Check admin status and build dropdown
            try {
                var profileRes = await fetch('/api/auth/profile/', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') }
                });
                var profile = await profileRes.json();

                if (profile.is_staff) {
                    var userMap = {};
                    data.forEach(function(m) {
                        if (m.user_id && m.user_email && !m.is_admin) {
                            userMap[m.user_id] = m.user_email;
                        }
                    });
                    var keys = Object.keys(userMap);
                    if (keys.length > 0) {
                        document.getElementById('adminReplyBar').style.display = 'block';
                        var sel = document.getElementById('targetUserSelect');
                        sel.innerHTML = '<option value="">-- Select user to reply --</option>' + keys.map(function(id) {
                            var selected = (id === selectedTargetUser) ? ' selected' : '';
                            return '<option value="' + id + '"' + selected + '>' + userMap[id] + '</option>';
                        }).join('');
                        if (selectedTargetUser && keys.includes(selectedTargetUser)) {
                            sel.value = selectedTargetUser;
                        sel.onchange = function() {
                            selectedTargetUser = this.value;
                        };
                        }
                    }
                } else {
                    document.getElementById('adminReplyBar').style.display = 'none';
                }
            } catch(e) {}
        } catch(e) {}
    }

    function appendMessage(message, isAdmin, time, userEmail) {
        var container = document.getElementById('chatMessages');
        if (container.querySelector('div[style]')) {
            container.innerHTML = '';
        }
        var sender = isAdmin ? 'NODE Support' : (userEmail || 'You');
        var wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper ' + (isAdmin ? 'admin' : 'user');
        wrapper.innerHTML =
            '<div class="msg-avatar-sm ' + (isAdmin ? 'admin' : 'user') + '">' + (isAdmin ? '👨‍💼' : '👤') + '</div>' +
            '<div class="msg-content">' +
                '<div class="sender">' + sender + '</div>' +
                '<div class="msg-bubble">' + escHtml(message) + '</div>' +
                '<div class="msg-time">' + (time || '') + '</div>' +
            '</div>';
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        var input = document.getElementById('messageInput');
        var msg = input.value.trim();
        if (!msg) return;

        var body = { message: msg };
        if (selectedTargetUser) {
            body.target_user_id = selectedTargetUser;
        }

        fetch('/api/chat/send/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('access_token')
            },
            body: JSON.stringify(body)
        }).then(function(res) {
            if (res.ok) {
                input.value = '';
                input.style.height = '40px';
                loadMessages();
            }
        });
    }

    function escHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function filterFAQ() {
        var query = document.getElementById('faqSearch').value.toLowerCase();
        var items = document.querySelectorAll('.faq-item');
        items.forEach(function(item) {
            item.style.display = item.textContent.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    document.getElementById('messageInput').addEventListener('input', function() {
        this.style.height = '40px';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    loadMessages();
    setInterval(loadMessages, 2000);
</script>
{% endblock %}
