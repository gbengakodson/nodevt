{% extends 'base/base.html' %}

{% block title %}Public | NODE 2.0{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #F0B90B;
        --bg-body: #0B0E11;
        --bg-card: #1A1C23;
        --text-primary: #EAECEF;
        --text-secondary: #848E9C;
        --border: #2B3139;
        --success: #0ECB81;
        --danger: #F6465D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-body) !important; overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .transparency-grid {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 10px;
        height: calc(100vh - 68px);
        padding: 10px;
        max-width: 100%;
    }
    .live-panel { overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; }
    .social-panel { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .live-panel::-webkit-scrollbar, .social-panel::-webkit-scrollbar { width: 4px; }
    .live-panel::-webkit-scrollbar-thumb, .social-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Mobile Tabs */
    .mobile-tabs { display: none; }
    @media (max-width: 900px) {
        .transparency-grid { grid-template-columns: 1fr; height: auto; }
        .mobile-tabs {
            display: flex; background: var(--bg-card); border-radius: 10px;
            border: 1px solid var(--border); padding: 3px; margin: 8px;
        }
        .mobile-tab {
            flex: 1; padding: 10px; text-align: center; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            background: transparent; border: none; color: var(--text-secondary);
        }
        .mobile-tab.active { background: var(--primary); color: #1E2329; }
        .social-panel { display: none; }
        .social-panel.show { display: flex; flex-direction: column; gap: 8px; }
        .live-panel.hide { display: none; }
    }

    /* Cards */
    .card {
        background: var(--bg-card); border-radius: 12px;
        border: 1px solid var(--border); padding: 14px;
    }
    .card-title {
        font-size: 12px; font-weight: 700; color: var(--text-primary);
        margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .card-title .icon { font-size: 14px; }

    /* Stats */
    .stats-row {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .stat-card {
        background: var(--bg-card); border-radius: 10px;
        border: 1px solid var(--border); padding: 10px 12px; text-align: center;
    }
    .stat-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 2px; }
    .stat-value.green { color: var(--success); }
    .stat-value.red { color: var(--danger); }
    .stat-sub { font-size: 9px; color: var(--text-secondary); margin-top: 1px; }

    /* Live dot */
    .live-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--success); animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(14,203,129,0.4); }
        70% { box-shadow: 0 0 0 6px rgba(14,203,129,0); }
        100% { box-shadow: 0 0 0 0 rgba(14,203,129,0); }
    }

    /* Tabs */
    .tabs {
        display: flex; gap: 2px; margin-bottom: 8px;
        background: rgba(255,255,255,0.03); border-radius: 6px; padding: 2px;
    }
    .tab-btn {
        background: transparent; border: none; color: var(--text-secondary);
        padding: 6px 12px; cursor: pointer; font-size: 10px; font-weight: 600;
        border-radius: 5px; white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: #1E2329; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; font-size: 10px; }
    .data-table th { padding: 6px 8px; text-align: left; background: rgba(240,185,11,0.04); color: var(--text-secondary); font-size: 9px; font-weight: 700; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-primary); }
    .data-table .buy { color: var(--success); }
    .data-table .sell { color: var(--danger); }

    /* Social Feed */
    .feed-composer {
        display: flex; gap: 8px; padding: 10px;
        background: rgba(255,255,255,0.02); border-radius: 10px;
        border: 1px solid var(--border);
    }
    .composer-avatar {
        width: 34px; height: 34px; border-radius: 50%;
        background: var(--primary); display: flex; align-items: center;
        justify-content: center; font-size: 15px; flex-shrink: 0; color: #1E2329;
    }
    .composer-input {
        flex: 1; padding: 8px 12px; border-radius: 18px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.03);
        color: var(--text-primary); font-size: 11px; resize: none; font-family: inherit;
    }
    .composer-input:focus { outline: none; border-color: var(--primary); }
    .composer-btn {
        padding: 6px 14px; border-radius: 18px; border: none;
        background: var(--primary); color: #1E2329;
        font-size: 10px; font-weight: 600; cursor: pointer;
    }

    .market-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        padding: 20px;
    }
    .market-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
    }
    .card-symbol { font-size: 20px; font-weight: 700; }
    .card-name { font-size: 12px; color: var(--text-secondary); }
    .card-weather { font-size: 14px; margin: 8px 0; }
    .card-discount { font-size: 18px; font-weight: 600; margin: 8px 0; }
    .card-price { font-size: 14px; color: var(--text-primary); }
    .card-trend { font-size: 12px; margin-top: 8px; padding: 2px 8px; border-radius: 4px; }
    .card-trend.downtrend { background: #f4433620; color: #f44336; }
    .card-trend.uptrend { background: #4CAF5020; color: #4CAF50; }
    .card-trend.neutral { background: #FFA00020; color: #FFA000; }
    .subscribe-box { margin-top: 20px; }

    .feed-post {
        background: rgba(255,255,255,0.02); border-radius: 10px;
        padding: 12px; border: 1px solid var(--border);
    }
    .post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .post-avatar {
        width: 30px; height: 30px; border-radius: 50%;
        background: var(--success); display: flex; align-items: center;
        justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0;
    }
    .post-username { font-size: 11px; font-weight: 600; color: var(--text-primary); }
    .post-time { font-size: 9px; color: var(--text-secondary); }
    .post-body { font-size: 12px; color: var(--text-primary); line-height: 1.4; margin-bottom: 8px; }
    .post-actions { display: flex; gap: 12px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.04); }
    .post-action { display: flex; align-items: center; gap: 3px; background: none; border: none; color: var(--text-secondary); font-size: 10px; cursor: pointer; }
    .post-action:hover { color: var(--primary); }
    .post-action.liked { color: var(--danger); }

    /* Reviews */
    .star { font-size: 16px; cursor: pointer; color: #3B3F48; transition: color 0.15s; }
    .star.active, .star:hover { color: var(--primary); }
    .review-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .review-stars { color: var(--primary); font-size: 10px; }
    .review-user { font-size: 9px; color: var(--text-secondary); }
    .review-text { font-size: 11px; color: var(--text-primary); line-height: 1.3; margin-top: 2px; }

    .panel-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .empty-state { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 10px; }

    @media (max-width: 768px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .stat-value { font-size: 15px; }
    }
</style>
{% endblock %}

{% block content %}
<!-- Mobile Tabs -->
<div class="mobile-tabs">
    <button class="mobile-tab active" onclick="switchMobileTab('live')">📊 Market Intelligence</button>
    <button class="mobile-tab" onclick="switchMobileTab('social')">💬 Community</button>
</div>

<div class="transparency-grid">
    <!-- LEFT PANEL: Live Data -->
    <div id="liveData" class="tab-pane active">
        <div class="market-cards" id="marketCards">
            <!-- Filled by JavaScript -->
        </div>
        <div style="text-align:center; margin-top:20px;">
            <p style="color:var(--text-secondary);">Powered by NodeV16, Fadakka, and NODE Economic Engine.</p>
            <p style="color:var(--text-secondary);">Not financial advice.</p>
            <div class="subscribe-box" style="margin-top:20px;">
                <input type="email" id="subscribeEmail" placeholder="Enter your email for daily forecast" style="padding:8px; width:250px;">
                <button onclick="subscribe()" class="btn-sm btn-confirm">Subscribe Free</button>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: Social -->
    <div class="social-panel" id="socialPanel">
        <!-- Reviews -->
        <div class="card">
            <div class="card-title"><span class="icon">⭐</span> Reviews <span style="font-size:10px;color:var(--text-secondary);" id="reviewCount">0</span></div>
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
                <div style="display:flex;gap:1px;" id="starPicker">
                    <span class="star" onclick="setRating(1)">☆</span>
                    <span class="star" onclick="setRating(2)">☆</span>
                    <span class="star" onclick="setRating(3)">☆</span>
                    <span class="star" onclick="setRating(4)">☆</span>
                    <span class="star" onclick="setRating(5)">☆</span>
                </div>
                <input type="text" id="reviewInput" placeholder="Quick review..." style="flex:1;padding:6px 10px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text-primary);font-size:10px;">
                <button onclick="submitReview()" class="composer-btn" style="padding:6px 12px;font-size:10px;">Post</button>
            </div>
            <div class="panel-scroll" style="max-height:200px;" id="reviewsList">
                <div class="empty-state">No reviews yet</div>
            </div>
        </div>

        <!-- Community Feed -->
        <div class="card" style="flex:1;">
            <div class="card-title"><span class="icon">💬</span> Community</div>
            <div class="feed-composer" style="margin-bottom:8px;">
                <div class="composer-avatar">👤</div>
                <input type="text" id="feedPostInput" class="composer-input" placeholder="Share something...">
                <button class="composer-btn" onclick="submitFeedPost()">Post</button>
            </div>
            <div class="panel-scroll" style="max-height:calc(100% - 60px);" id="feedPosts">
                <div class="empty-state">Loading...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    var currentOpenOrders = [];
    var currentTrades = [];
    var reviewRating = 0;

    function getToken() { return localStorage.getItem('access_token'); }
    function fc(num) {
        if (!num) return '$0.00';
        var v = parseFloat(num);
        if (isNaN(v) || v === 0) return '$0.00';
        return '$' + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    function formatTime(ts) {
        var d = new Date(ts);
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    // ========== MOBILE TAB SWITCH ==========
    function switchMobileTab(tab) {
        document.querySelectorAll('.mobile-tab').forEach(function(b, i) {
            b.classList.toggle('active', (tab === 'live' && i === 0) || (tab === 'social' && i === 1));
        });
        document.getElementById('livePanel').classList.toggle('hide', tab !== 'live');
        document.getElementById('socialPanel').classList.toggle('show', tab === 'social');
    }

    // ========== LIVE DATA ==========
    async function loadPublicGridData() {
        try {
            var data = await fetch('/api/trading/master_grid_live/', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            }).then(r => r.json());
            var grids = data.grids || [];
            var totalInvested = 0, totalValue = 0;
            currentOpenOrders = []; currentTrades = [];

            grids.forEach(function(grid) {
                totalInvested += grid.invested;
                totalValue += grid.current_value || (grid.invested + grid.total_pnl);
                grid.open_orders.forEach(function(o) { o.coin = grid.symbol; currentOpenOrders.push(o); });
                grid.recent_trades.forEach(function(t) { t.coin = grid.symbol; currentTrades.push(t); });
            });

            document.getElementById('pubInvested').textContent = fc(totalInvested);
            document.getElementById('pubValue').textContent = fc(totalValue);
            var pnl = totalValue - totalInvested;
            var pnlEl = document.getElementById('pubPnl');
            pnlEl.textContent = (pnl >= 0 ? '+' : '') + fc(pnl);
            pnlEl.className = 'stat-value ' + (pnl >= 0 ? 'green' : 'red');

            var monthPnl = currentTrades.reduce(function(s, t) { return s + (t.matched_pnl || 0); }, 0);
            var monthPct = totalInvested > 0 ? (monthPnl / totalInvested * 100) : 0;
            document.getElementById('pubMonthPnl').textContent = (monthPnl >= 0 ? '+' : '') + fc(monthPnl);
            document.getElementById('pubMonthPnl').className = 'stat-value ' + (monthPnl >= 0 ? 'green' : 'red');
            document.getElementById('pubMonthPnlPct').textContent = (monthPct >= 0 ? '+' : '') + monthPct.toFixed(1) + '%';

            document.getElementById('pubOpenCount').textContent = currentOpenOrders.length;
            document.getElementById('pubTradesCount').textContent = currentTrades.length;
            document.getElementById('binanceTime').textContent = new Date().toLocaleTimeString();
            showPubTab('open');
        } catch(e) { console.error(e); }
    }

    function showPubTab(tab) {
        document.querySelectorAll('[data-pubtab]').forEach(function(b) { b.classList.remove('active'); });
        document.querySelector('[data-pubtab="' + tab + '"]').classList.add('active');
        var content = document.getElementById('pubTabContent');

        if (tab === 'open') {
            currentOpenOrders.sort(function(a, b) { return b.time - a.time; });
            content.innerHTML = currentOpenOrders.length === 0
                ? '<div class="empty-state">No open orders</div>'
                : '<table class="data-table"><thead><tr><th>Coin</th><th>Buy</th><th></th><th>Sell</th><th>Spread</th></tr></thead><tbody>' +
                    currentOpenOrders.map(function(o) {
                        return '<tr><td><strong>' + o.coin + '</strong></td>' +
                            '<td class="buy">' + (o.side === 'BUY' ? 'Buy ' + o.quantity.toFixed(0) + ' @ ' + fc(o.price) : '—') + '</td>' +
                            '<td>→</td>' +
                            '<td class="sell">' + (o.side === 'SELL' ? 'Sell ' + o.quantity.toFixed(0) + ' @ ' + fc(o.price) : '—') + '</td>' +
                            '<td>—</td></tr>';
                    }).join('') + '</tbody></table>';
        } else {
            currentTrades.sort(function(a, b) { return b.time - a.time; });
            var pnl24h = currentTrades.filter(function(t) { return t.time > Date.now() - 86400000; }).reduce(function(s, t) { return s + (t.matched_pnl || 0); }, 0);
            content.innerHTML = currentTrades.length === 0
                ? '<div class="empty-state">No completed trades</div>'
                : '<div style="font-size:10px;color:var(--text-secondary);margin-bottom:6px;">' + currentTrades.length + ' trades | 24h PNL: ' + fc(pnl24h) + '</div>' +
                    '<table class="data-table"><thead><tr><th>Coin</th><th>Time</th><th>Price</th><th>Side</th><th>PNL</th></tr></thead><tbody>' +
                    currentTrades.map(function(t) {
                        var pnlClass = t.matched_pnl >= 0 ? 'buy' : 'sell';
                        return '<tr><td><strong>' + t.coin + '</strong></td><td>' + formatTime(t.time) + '</td><td>' + fc(t.price) + '</td><td class="' + (t.side === 'BUY' ? 'buy' : 'sell') + '">' + t.side + '</td><td class="' + pnlClass + '">' + (t.matched_pnl >= 0 ? '+' : '') + fc(t.matched_pnl) + '</td></tr>';
                    }).join('') + '</tbody></table>';
        }
    }

    // ========== HISTORY TABS ==========
    document.querySelectorAll('[data-tab]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('[data-tab]').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            var tab = this.getAttribute('data-tab');
            if (tab === 'deposits') loadHistory('/public/deposits/', 'deposits');
            if (tab === 'withdrawals') loadHistory('/public/withdrawals/', 'withdrawals');
            if (tab === 'holders') loadHistory('/public/holders/', 'holders');
        });
    });

    async function loadHistory(url, type) {
        try {
            var data = await fetch('/api/public/grid-live/').then(r => r.json());
            var container = document.getElementById('historyContent');
            if (type === 'holders') {
                container.innerHTML = '<table class="data-table"><thead><tr><th>User</th><th>Token</th><th>Value</th><th>PNL</th></tr></thead><tbody>' +
                    data.map(function(h) { return '<tr><td>' + (h.user || h.email || '—') + '</td><td>' + (h.token_symbol || '—') + '</td><td>' + fc(h.value) + '</td><td class="' + (h.pnl >= 0 ? 'buy' : 'sell') + '">' + fc(h.pnl) + '</td></tr>'; }).join('') + '</tbody></table>';
            } else {
                container.innerHTML = '<table class="data-table"><thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Status</th></tr></thead><tbody>' +
                    data.map(function(d) { return '<tr><td>' + (d.created_at || '—') + '</td><td>' + (d.user || d.email || '—') + '</td><td>' + fc(d.amount) + '</td><td>' + (d.status || '—') + '</td></tr>'; }).join('') + '</tbody></table>';
            }
        } catch(e) { container.innerHTML = '<div class="empty-state">Unable to load</div>'; }
    }

    async function loadMarketIntelligence() {
        try {
            const res = await fetch('/api/public/market-intelligence/');
            const data = await res.json();
            const container = document.getElementById('marketCards');
            if (!data.length) {
                container.innerHTML = '<p>No data available.</p>';
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="market-card">
                    <div class="card-symbol">${item.symbol}</div>
                    <div class="card-name">${item.name || ''}</div>
                    <div class="card-weather">${getWeatherIcon(item.weather)} ${item.weather}</div>
                    ${item.fadakka_discount !== null ? `
                    <div class="card-discount" style="color:${item.fadakka_discount < -20 ? '#4CAF50' : (item.fadakka_discount > 20 ? '#f44336' : '#FFA000')};">
                        ${item.fadakka_discount < 0 ? '↓' : '↑'} ${Math.abs(item.fadakka_discount)}% ${item.fadakka_discount < 0 ? 'Discount' : 'Premium'}
                    </div>` : ''}
                    ${item.price ? `<div class="card-price">$${item.price.toLocaleString()}</div>` : ''}
                    <div class="card-trend ${item.trend.toLowerCase()}">${item.trend}</div>
                </div>
            `).join('');
        } catch(e) { console.error(e); }
    }

    function getWeatherIcon(weather) {
        if (weather.includes('Storm')) return '⛈';
        if (weather.includes('Rain')) return '🌧';
        if (weather.includes('Sunny')) return '☀️';
        if (weather.includes('Cloud')) return '☁️';
        return '🌤';
    }

    function subscribe() {
        const email = document.getElementById('subscribeEmail').value;
        if (!email) return alert('Enter email');
        // Add your subscription logic (store in DB, or use Mailchimp)
        alert('Subscribed! (feature coming soon)');
    }

    // Load on page load
    loadMarketIntelligence();

    // ========== REVIEWS ==========
    function setRating(star) {
        reviewRating = star;
        document.querySelectorAll('.star').forEach(function(s, i) {
            s.textContent = i < star ? '★' : '☆';
            s.classList.toggle('active', i < star);
        });
    }

    async function submitReview() {
        var msg = document.getElementById('reviewInput').value.trim();
        if (!msg || reviewRating === 0) return;
        try {
            await fetch('/api/chat/reviews/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                body: JSON.stringify({ rating: reviewRating, message: msg })
            });
            document.getElementById('reviewInput').value = '';
            reviewRating = 0;
            document.querySelectorAll('.star').forEach(function(s) { s.textContent = '☆'; s.classList.remove('active'); });
            loadReviews();
        } catch(e) {}
    }

    async function loadReviews() {
        try {
            var reviews = await fetch('/api/chat/reviews/').then(r => r.json());
            document.getElementById('reviewCount').textContent = reviews.length + ' reviews';
            var container = document.getElementById('reviewsList');
            container.innerHTML = reviews.length === 0 ? '<div class="empty-state">No reviews yet</div>' :
                reviews.map(function(r) {
                    return '<div class="review-item"><div style="display:flex;justify-content:space-between;"><span class="review-stars">' + '★'.repeat(r.rating) + '</span><span class="review-user">' + (r.username || 'User') + '</span></div><div class="review-text">' + r.message + '</div></div>';
                }).join('');
        } catch(e) {}
    }

    // ========== COMMUNITY FEED ==========
    async function submitFeedPost() {
        var msg = document.getElementById('feedPostInput').value.trim();
        if (!msg) return;
        try {
            await fetch('/api/chat/transparency/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                body: JSON.stringify({ message: msg })
            });
            document.getElementById('feedPostInput').value = '';
            loadFeed();
        } catch(e) {}
    }

    async function loadFeed() {
        try {
            var posts = await fetch('/api/chat/transparency/').then(r => r.json());
            var container = document.getElementById('feedPosts');
            container.innerHTML = posts.length === 0 ? '<div class="empty-state">No posts yet</div>' :
                posts.map(function(p) {
                    return '<div class="feed-post"><div class="post-header"><div class="post-avatar">👤</div><div><div class="post-username">' + (p.username || 'User') + '</div><div class="post-time">' + (p.created_at || '') + '</div></div></div><div class="post-body">' + p.message + '</div><div class="post-actions"><button class="post-action" onclick="likePost(\'' + p.id + '\')">👍 <span>' + (p.likes || 0) + '</span></button></div></div>';
                }).join('');
        } catch(e) {}
    }

    async function likePost(id) {
        try {
            await fetch('/api/chat/transparency/like/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                body: JSON.stringify({ post_id: id })
            });
            loadFeed();
        } catch(e) {}
    }

    // ========== PUB TAB SWITCHING ==========
    document.querySelectorAll('[data-pubtab]').forEach(function(btn) {
        btn.addEventListener('click', function() {
