{% extends 'base/base.html' %}

{% block title %}Master Grid Live | NODE{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #F0B90B;
        --bg-body: #0B0E11;
        --bg-card: #1E2329;
        --text-primary: #EAECEF;
        --text-secondary: #848E9C;
        --border: #2B3139;
        --success: #0ECB81;
        --danger: #F6465D;
    }

    * { box-sizing: border-box; }
    body { background: var(--bg-body) !important; }

    .yield-container { max-width: 1200px; margin: 0 auto; padding: 12px; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 12px; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 3px; width: fit-content; }
    .tab-btn { background: transparent; border: none; color: var(--text-secondary); padding: 8px 16px; cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 5px; }
    .tab-btn.active { background: var(--primary); color: #1E2329; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); padding: 12px 14px; }
    .stat-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 4px; }
    .stat-sub { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
    .stat-value.green { color: var(--success); }
    .stat-value.red { color: var(--danger); }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-table th { padding: 8px 10px; text-align: left; background: rgba(240,185,11,0.04); color: var(--text-secondary); font-size: 10px; font-weight: 700; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-primary); }
    .data-table tr:hover { background: rgba(240,185,11,0.02); }
    .buy { color: var(--success); }
    .sell { color: var(--danger); }
    .filled { color: var(--success); }
    .new { color: var(--primary); }
    .canceled { color: var(--text-secondary); }

    .card { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); padding: 16px; margin-bottom: 10px; }
    .card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; }

    @media (max-width: 768px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .data-table { font-size: 10px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="yield-container">
    <!-- Bot Selector -->
    <div class="tabs" id="botSelector">
        <span style="color:var(--text-secondary);padding:8px;">Loading grids...</span>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Invested</div>
            <div class="stat-value" id="statInvested">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Current Value</div>
            <div class="stat-value" id="statValue">$0</div>
            <div class="stat-sub" id="statValueChange" style="font-size:9px;color:var(--text-secondary);"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total PNL</div>
            <div class="stat-value" id="statPnl">$0</div>
            <div class="stat-sub" style="font-size:9px;color:var(--text-secondary);">
                Realised PNL: <span id="statRealized" style="color:var(--success);">$0 (0%)</span> |
                Unrealised PNL: <span id="statUnrealized" style="color:var(--success);">$0 (0%)</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Open Orders</div>
            <div class="stat-value" id="statOrders">0</div>
            <div class="stat-sub" style="font-size:9px;color:var(--text-secondary);">
                Completed: <span id="statCompleted" style="color:var(--success);">0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="tabs" style="margin-bottom:10px;">
            <button class="tab-btn active" data-ytab="open">Open Orders (<span id="openCount">0</span>)</button>
            <button class="tab-btn" data-ytab="history">Order History (<span id="historyCount">0</span>)</button>
            <button class="tab-btn" data-ytab="trades">Trade History (<span id="tradesCount">0</span>)</button>
        </div>

        <div id="tabStats" style="font-size:10px;color:var(--text-secondary);margin-bottom:8px;"></div>

        <div class="scroll-table" style="max-height:300px;overflow-y:auto;" id="tabContent"></div>
    </div>
</div>

<script>
    const API = '/api';
    var gridData = [];
    var currentSymbol = '';

    function getToken() { return localStorage.getItem('access_token'); }
    async function apiCall(url) {
        var token = getToken();
        var res = await fetch(API + url, { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
        if (res.status === 401) { window.location.href = '/login/'; return {}; }
        return res.json();
    }

    function fc(num) {
        if (!num) return '$0.00';
        var v = parseFloat(num);
        if (isNaN(v) || v === 0) return '$0.00';
        if (Math.abs(v) < 0.01) return '$' + v.toFixed(8);
        return '$' + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4});
    }

    function formatTime(ts) {
        var d = new Date(ts);
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
    }

    async function loadGridData() {
        try {
            var data = await apiCall('/trading/master_grid_live/');
            gridData = data.grids || [];

            // Bot selector
            var sel = document.getElementById('botSelector');
            if (gridData.length === 0) {
                sel.innerHTML = '<span style="color:var(--text-secondary);padding:8px;">No active Master Grids</span>';
                return;
            }
            sel.innerHTML = gridData.map(function(g, i) {
                return '<button class="tab-btn' + (i === 0 ? ' active' : '') + '" onclick="selectGrid(\'' + g.symbol + '\')">' + g.symbol + ' 🤖</button>';
            }).join('');

            if (!currentSymbol && gridData.length > 0) {
                selectGrid(gridData[0].symbol);
            } else if (currentSymbol) {
                selectGrid(currentSymbol);
            }
        } catch(e) {
            console.error('Grid data fetch failed, will retry');
        }
    }

    function selectGrid(symbol) {
        currentSymbol = symbol;
        var grid = gridData.find(function(g) { return g.symbol === symbol; });
        if (!grid) return;

        // Update bot selector tabs
        document.querySelectorAll('.tab-btn').forEach(function(b) {
            b.classList.toggle('active', b.textContent.includes(symbol));
        });

        // === STAT CARDS ===
        document.getElementById('statInvested').textContent = fc(grid.invested);

        var currentValue = grid.invested + grid.total_pnl;
        var valueChange = grid.invested > 0 ? (grid.total_pnl / grid.invested * 100) : 0;
        document.getElementById('statValue').textContent = fc(currentValue);
        document.getElementById('statValue').className = 'stat-value ' + (grid.total_pnl >= 0 ? 'green' : 'red');
        document.getElementById('statValueChange').textContent = (valueChange >= 0 ? '+' : '') + valueChange.toFixed(1) + '%';
        document.getElementById('statValueChange').style.color = grid.total_pnl >= 0 ? 'var(--success)' : 'var(--danger)';

        document.getElementById('statPnl').textContent = (grid.total_pnl >= 0 ? '+' : '') + fc(grid.total_pnl);
        document.getElementById('statPnl').className = 'stat-value ' + (grid.total_pnl >= 0 ? 'green' : 'red');

        var rPct = grid.invested > 0 ? (grid.realized_pnl / grid.invested * 100) : 0;
        document.getElementById('statRealized').textContent = (grid.realized_pnl >= 0 ? '+' : '') + fc(grid.realized_pnl) + ' (' + rPct.toFixed(1) + '%)';
        document.getElementById('statRealized').style.color = grid.realized_pnl >= 0 ? 'var(--success)' : 'var(--danger)';

        var uPct = grid.invested > 0 ? (grid.unrealized_pnl / grid.invested * 100) : 0;
        document.getElementById('statUnrealized').textContent = (grid.unrealized_pnl >= 0 ? '+' : '') + fc(grid.unrealized_pnl) + ' (' + uPct.toFixed(1) + '%)';
        document.getElementById('statUnrealized').style.color = grid.unrealized_pnl >= 0 ? 'var(--success)' : 'var(--danger)';

        document.getElementById('statOrders').textContent = grid.open_orders.length;
        var completedCount = grid.order_history.filter(function(o){ return o.status === 'FILLED'; }).length;
        document.getElementById('statCompleted').textContent = completedCount;

        // === TABBED PANEL ===
        document.getElementById('openCount').textContent = grid.open_orders.length;
        document.getElementById('historyCount').textContent = grid.order_history.length;
        document.getElementById('tradesCount').textContent = grid.recent_trades.length;

        showYTab('open', grid);
    }

    function showYTab(tab, grid) {
        document.querySelectorAll('[data-ytab]').forEach(function(b) { b.classList.remove('active'); });
        document.querySelector('[data-ytab="' + tab + '"]').classList.add('active');

        var stats = document.getElementById('tabStats');
        var content = document.getElementById('tabContent');

        if (tab === 'open') {
            stats.innerHTML = grid.open_orders.length + ' open orders';
            content.innerHTML = grid.open_orders.length === 0
                ? '<div style="text-align:center;color:var(--text-secondary);padding:20px;">No open orders</div>'
                : '<table class="data-table"><thead><tr><th>Price</th><th>Amount</th><th>Total</th></tr></thead><tbody>' +
                    grid.open_orders.map(function(o) {
                        return '<tr><td>' + fc(o.price) + '</td><td>' + o.quantity.toFixed(2) + '</td><td>' + fc(o.total) + '</td></tr>';
                    }).join('') + '</tbody></table>';
        } else if (tab === 'history') {
            var filled = grid.order_history.filter(function(o){ return o.status === 'FILLED'; }).length;
            var cancelled = grid.order_history.filter(function(o){ return o.status !== 'FILLED'; }).length;
            stats.innerHTML = grid.order_history.length + ' orders | Filled: ' + filled + ' | Cancelled: ' + cancelled;
            content.innerHTML = '<table class="data-table"><thead><tr><th>Time</th><th>Price</th><th>Amount</th><th>Side</th><th>Status</th></tr></thead><tbody>' +
                grid.order_history.map(function(o) {
                    var sc = o.status === 'FILLED' ? 'filled' : 'canceled';
                    return '<tr><td>' + formatTime(o.time) + '</td><td>' + fc(o.price) + '</td><td>' + o.quantity.toFixed(2) + '</td><td class="' + (o.side === 'BUY' ? 'buy' : 'sell') + '">' + o.side + '</td><td><span class="' + sc + '">' + o.status + '</span></td></tr>';
                }).join('') + '</tbody></table>';
        } else if (tab === 'trades') {
            var trades24h = grid.recent_trades.filter(function(t){ return t.time > Date.now() - 86400000; });
            var profit24h = trades24h.reduce(function(s, t){ return s + (t.side === 'SELL' ? t.total : -t.total); }, 0);
            stats.innerHTML = grid.recent_trades.length + ' trades | 24h: ' + trades24h.length + ' trades | 24h PNL: ' + fc(profit24h);
            content.innerHTML = '<table class="data-table"><thead><tr><th>Time</th><th>Price</th><th>Amount</th><th>Total</th><th>Side</th></tr></thead><tbody>' +
                grid.recent_trades.map(function(t) {
                    return '<tr><td>' + formatTime(t.time) + '</td><td>' + fc(t.price) + '</td><td>' + t.quantity.toFixed(2) + '</td><td>' + fc(t.total) + '</td><td class="' + (t.side === 'BUY' ? 'buy' : 'sell') + '">' + t.side + '</td></tr>';
                }).join('') + '</tbody></table>';
        }
    }


    document.querySelectorAll('[data-ytab]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var tab = this.getAttribute('data-ytab');
            var grid = gridData.find(function(g) { return g.symbol === currentSymbol; });
            if (grid) showYTab(tab, grid);
        });
    });

    loadGridData();
    setInterval(loadGridData, 60000);
</script>
{% endblock %}
