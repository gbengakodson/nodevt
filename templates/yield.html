{% extends 'base/base.html' %}

{% block title %}Expert Advisor | NODE{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #F0B90B;
        --bg-body: #0B0E11;
        --bg-card: #1E2329;
        --text-primary: #EAECEF;
        --text-secondary: #848E9C;
        --border: #2B3139;
        --success: #0ECB81;
        --danger: #F6465D;
    }

    * { box-sizing: border-box; }
    body { background: var(--bg-body) !important; }

    .yield-container { max-width: 1200px; margin: 0 auto; padding: 12px; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 12px; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 3px; width: fit-content; }
    .tab-btn { background: transparent; border: none; color: var(--text-secondary); padding: 8px 16px; cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 5px; }
    .tab-btn.active { background: var(--primary); color: #1E2329; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); padding: 12px 14px; }
    .stat-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 4px; }
    .stat-sub { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
    .stat-value.green { color: var(--success); }
    .stat-value.red { color: var(--danger); }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-table th { padding: 8px 10px; text-align: left; background: rgba(240,185,11,0.04); color: var(--text-secondary); font-size: 10px; font-weight: 700; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-primary); }
    .data-table tr:hover { background: rgba(240,185,11,0.02); }
    .buy { color: var(--success); }
    .sell { color: var(--danger); }
    .filled { color: var(--success); }
    .new { color: var(--primary); }
    .canceled { color: var(--text-secondary); }

    .card { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); padding: 16px; margin-bottom: 10px; }
    .card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; }

    @media (max-width: 768px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .data-table { font-size: 10px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="yield-container">
    <!-- Account Selector -->
    <div class="tabs" id="accountSelector">
        <span style="color:var(--text-secondary);padding:8px;">Loading accounts...</span>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Account Type</div>
            <div class="stat-value" id="statExchange">-</div>
            <div class="stat-sub" id="statLabel">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Stablecoin Balance</div>
            <div class="stat-value green" id="statBalance">$0</div>
            <div class="stat-sub">USDT + USDC</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Status</div>
            <div class="stat-value green" id="statStatus">-</div>
            <div class="stat-sub">Live Connection</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Active Trades</div>
            <div class="stat-value" id="statOrders">0</div>
            <div class="stat-sub">Placed by NODE Master Grid</div>
        </div>
    </div>

    <div class="card">
        <div class="tabs" style="margin-bottom:10px;">
            <button class="tab-btn active" data-ytab="balances">Balances</button>
            <button class="tab-btn" data-ytab="orders">Open Orders (<span id="openCount">0</span>)</button>
        </div>

        <div class="scroll-table" style="max-height:300px;overflow-y:auto;" id="tabContent"></div>
    </div>
</div>

<script>
    const API = '/api';
    var accountData = [];
    var currentExchange = '';

    function getToken() { return localStorage.getItem('access_token'); }

    async function apiCall(url) {
        var token = getToken();
        var res = await fetch(API + url, { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
        if (res.status === 401) { window.location.href = '/login/'; return []; }
        return res.json();
    }

    function fc(num) {
        if (!num) return '$0.00';
        var v = parseFloat(num);
        if (isNaN(v) || v === 0) return '$0.00';
        if (Math.abs(v) < 0.01) return '$' + v.toFixed(8);
        return '$' + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4});
    }

    async function loadExternalAccounts() {
        try {
            // We hit the new endpoint we created for external balances/activity
            var data = await apiCall('/exchange/external_activity/');
            accountData = data || [];

            var sel = document.getElementById('accountSelector');
            if (accountData.length === 0) {
                sel.innerHTML = '<span style="color:var(--text-secondary);padding:8px;">No accounts connected. <a href="/trading/" style="color:var(--primary);">Connect here</a></span>';
                document.getElementById('tabContent').innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px;">Connect an API key to see live activity.</div>';
                return;
            }

            sel.innerHTML = accountData.map(function(acc, i) {
                return '<button class="tab-btn' + (i === 0 ? ' active' : '') + '" onclick="selectAccount(\'' + acc.id + '\')">' + acc.exchange + (acc.label ? ' (' + acc.label + ')' : '') + '</button>';
            }).join('');

            if (!currentExchange && accountData.length > 0) {
                selectAccount(accountData[0].id);
            } else if (currentExchange) {
                selectAccount(currentExchange);
            }
        } catch(e) {
            console.error('Account data fetch failed');
        }
    }

    function selectAccount(accountId) {
        currentExchange = accountId;
        var acc = accountData.find(function(a) { return a.id === accountId; });
        if (!acc) return;

        // Update tabs
        document.querySelectorAll('.tab-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('onclick')?.includes(accountId));
        });

        // === STAT CARDS ===
        document.getElementById('statExchange').textContent = acc.exchange;
        document.getElementById('statLabel').textContent = acc.label || 'Active Account';

        // Calculate total stablecoin balance
        var usdt = acc.balances['USDT'] || 0;
        var usdc = acc.balances['USDC'] || 0;
        document.getElementById('statBalance').textContent = fc(usdt + usdc);

        if (acc.status === 'error') {
            document.getElementById('statStatus').textContent = 'ERROR';
            document.getElementById('statStatus').className = 'stat-value red';
        } else {
            document.getElementById('statStatus').textContent = 'LIVE';
            document.getElementById('statStatus').className = 'stat-value green';
        }

        document.getElementById('statOrders').textContent = acc.open_orders ? acc.open_orders.length : 0;

        // === TABBED PANEL ===
        document.getElementById('openCount').textContent = acc.open_orders ? acc.open_orders.length : 0;

        showYTab('balances', acc);
    }

    function showYTab(tab, acc) {
        document.querySelectorAll('[data-ytab]').forEach(function(b) { b.classList.remove('active'); });
        document.querySelector('[data-ytab="' + tab + '"]').classList.add('active');

        var content = document.getElementById('tabContent');

        if (tab === 'balances') {
            var rows = Object.keys(acc.balances).map(function(coin) {
                var amount = acc.balances[coin];
                return '<tr>' +
                    '<td style="font-weight:700;">' + coin + '</td>' +
                    '<td style="color:var(--success);">' + amount.toFixed(4) + '</td>' +
                '</tr>';
            }).join('');

            content.innerHTML = rows.length === 0
                ? '<div style="text-align:center;color:var(--text-secondary);padding:20px;">No assets found in this account</div>'
                : '<table class="data-table"><thead><tr><th>Asset</th><th>Available Balance</th></tr></thead><tbody>' + rows + '</tbody></table>';

        } else if (tab === 'orders') {
            if (!acc.open_orders || acc.open_orders.length === 0) {
                content.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px;">No active trades currently placed by NODE.</div>';
                return;
            }

            var rows = acc.open_orders.map(function(o) {
                return '<tr>' +
                    '<td>' + o.symbol + '</td>' +
                    '<td class="' + (o.side === 'BUY' ? 'buy' : 'sell') + '">' + o.side + '</td>' +
                    '<td>' + fc(o.price) + '</td>' +
                    '<td>' + o.amount + '</td>' +
                    '<td><span class="new">' + o.status + '</span></td>' +
                '</tr>';
            }).join('');

            content.innerHTML = '<table class="data-table"><thead><tr><th>Pair</th><th>Side</th><th>Price</th><th>Amount</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>';
        }
    }


    document.querySelectorAll('[data-ytab]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var tab = this.getAttribute('data-ytab');
            var acc = accountData.find(function(a) { return a.id === currentExchange; });
            if (acc) showYTab(tab, acc);
        });
    });

    loadExternalAccounts();
    setInterval(loadExternalAccounts, 60000);
</script>
{% endblock %}
