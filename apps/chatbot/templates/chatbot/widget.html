<!-- Chatbot Widget - Dark Theme -->
<style>
    .chatbot-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
    }

    .chatbot-button {
        width: 56px; height: 56px; border-radius: 50%;
        background: var(--primary, #F0B90B); border: none;
        cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        transition: all 0.3s; font-size: 24px;
    }
    .chatbot-button:hover { transform: scale(1.1); }

    .chatbot-window {
        position: fixed; bottom: 90px; right: 20px;
        width: 360px; height: 520px;
        background: #1E2329; border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        display: none; flex-direction: column; overflow: hidden; z-index: 1000;
        border: 1px solid #2B3139;
    }

    @media (max-width: 768px) {
        .chatbot-window {
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; border-radius: 0;
        }
    }

    .chatbot-header {
        background: #F0B90B; color: #0B0E11;
        padding: 12px 16px; font-weight: 600; font-size: 13px;
        display: flex; justify-content: space-between; align-items: center;
    }

    .chatbot-messages {
        flex: 1; overflow-y: auto; padding: 12px;
        background: #1A1C23;
        scrollbar-width: thin; scrollbar-color: #2B3139 transparent;
    }

    .chatbot-message { margin-bottom: 12px; display: flex; }
    .chatbot-message.user { justify-content: flex-end; }
    .chatbot-message.bot { justify-content: flex-start; }

    .chatbot-bubble {
        max-width: 85%; padding: 10px 14px; border-radius: 14px;
        font-size: 12px; line-height: 1.5;
    }
    .chatbot-message.user .chatbot-bubble {
        background: #F0B90B; color: #0B0E11;
    }
    .chatbot-message.bot .chatbot-bubble {
        background: #2B3139; color: #EAECEF; border: 1px solid #3A4149;
    }

    .quick-questions {
        padding: 10px; background: #1E2329; border-top: 1px solid #2B3139;
    }
    .quick-title {
        font-size: 10px; color: #848E9C; margin-bottom: 6px; text-align: center;
    }
    .questions-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-question {
        background: #2B3139; border: 1px solid #3A4149; border-radius: 16px;
        padding: 5px 10px; font-size: 10px; cursor: pointer;
        transition: all 0.2s; color: #EAECEF;
    }
    .quick-question:hover { background: #F0B90B; border-color: #F0B90B; color: #0B0E11; }

    .chatbot-input-area {
        padding: 10px; border-top: 1px solid #2B3139;
        display: flex; gap: 8px; background: #1E2329;
    }
    .chatbot-input {
        flex: 1; padding: 10px 14px; border-radius: 20px;
        border: 1px solid #2B3139; background: #1A1C23;
        color: #EAECEF; font-size: 12px; outline: none;
    }
    .chatbot-input:focus { border-color: #F0B90B; }
    .chatbot-send {
        background: #F0B90B; border: none; padding: 10px 18px;
        border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 12px;
    }
    .chatbot-close { background: none; border: none; color: #0B0E11; font-size: 20px; cursor: pointer; }
    .typing { color: #848E9C; font-style: italic; }
</style>

<div class="chatbot-widget">
    <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
            <span>🤖 NODE Assistant</span>
            <button class="chatbot-close" onclick="closeChatbot()">✕</button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="chatbot-message bot">
                <div class="chatbot-bubble">
                    👋 Hi! I'm your NODE assistant.<br><br>
                    I can help with:<br>
                    💰 Deposits & Withdrawals<br>
                    🛒 Trading & Grid Bots<br>
                    🌟 Yield Earnings<br>
                    🤝 Referral Program<br><br>
                    Ask me anything or tap below!
                </div>
            </div>
        </div>
        <div class="quick-questions">
            <div class="quick-title">📌 Quick Questions</div>
            <div class="questions-grid" id="quickQuestions">
                <button class="quick-question" data-question="How do I deposit USDC?">💰 Deposit</button>
                <button class="quick-question" data-question="How to withdraw?">🏦 Withdraw</button>
                <button class="quick-question" data-question="How do I buy tokens?">🛒 Buy</button>
                <button class="quick-question" data-question="What is a grid bot?">🤖 Grid Bot</button>
                <button class="quick-question" data-question="How do I earn yield?">🌟 Yield</button>
                <button class="quick-question" data-question="How does referral work?">🤝 Referral</button>
                <button class="quick-question" data-question="What are the fees?">💸 Fees</button>
                <button class="quick-question" data-question="Check my balance">📊 Balance</button>
            </div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="chatbot-send" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <button class="chatbot-button" onclick="toggleChatbot()">🤖</button>
</div>

<script>
    var chatbotOpen = false;

    function toggleChatbot() {
        chatbotOpen = !chatbotOpen;
        document.getElementById('chatbotWindow').style.display = chatbotOpen ? 'flex' : 'none';
    }

    function closeChatbot() {
        chatbotOpen = false;
        document.getElementById('chatbotWindow').style.display = 'none';
    }

    document.querySelectorAll('.quick-question').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var question = this.getAttribute('data-question');
            document.getElementById('chatbotInput').value = question;
            sendMessage();
        });
    });

    async function sendMessage() {
        var input = document.getElementById('chatbotInput');
        var message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';
        addTyping();

        try {
            var res = await fetch('/api/chatbot/message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                },
                body: JSON.stringify({ message: message })
            });
            var data = await res.json();
            removeTyping();
            addMessage(data.response, 'bot');
        } catch(e) {
            removeTyping();
            addMessage('Sorry, something went wrong. Try again.', 'bot');
        }
    }

    function addMessage(text, sender) {
        var div = document.createElement('div');
        div.className = 'chatbot-message ' + sender;
        var formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        div.innerHTML = '<div class="chatbot-bubble">' + formatted + '</div>';
        var container = document.getElementById('chatbotMessages');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addTyping() {
        var div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'chatbot-message bot';
        div.innerHTML = '<div class="chatbot-bubble typing">🤖 Typing...</div>';
        document.getElementById('chatbotMessages').appendChild(div);
    }

    function removeTyping() {
        var el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }
</script>
